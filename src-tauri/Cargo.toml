[package]
name = "graphene"
version = "1.6.0"
description = "Graphene — markdown notes and reusable code snippets as code blocks"
authors = ["MogensenJesse"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "graphene_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
# tauri::test (a mock app) lets a test run the real fs scope against the vault_scan path check
tauri = { version = "2", features = ["test"] }

# Release build (audit plan P13): link-time optimisation and one codegen unit shrink and speed up the binary; "s" because the
# Rust side is IO-bound (file reads, one IPC call per scan), so size beats the last bit of speed; abort drops the unwinding code
# (no panic may be needed to recover: the scan and the commands return errors instead).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
